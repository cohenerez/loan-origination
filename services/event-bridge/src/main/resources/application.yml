server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: event-bridge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bridge}
    username: ${DB_USERNAME:scoring}
    password: ${DB_PASSWORD:scoring}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Consumers map the JSON to their own class; don't leak this service's class names
        spring.json.add.type.headers: false

bridge:
  salesforce:
    login-url: ${SF_LOGIN_URL:}
    client-id: ${SF_CLIENT_ID:}
    client-secret: ${SF_CLIENT_SECRET:}
  topic: /event/LoanStatusChanged__e
  kafka-topic: loan-events
  batch-size: 100
  subscription-enabled: ${SUBSCRIPTION_ENABLED:true}
  reconnect-delay: 5s
  # Active/standby: run 2+ instances; the one holding the PostgreSQL advisory lock subscribes
  leader-election-enabled: ${LEADER_ELECTION_ENABLED:true}
  leader-lock-key: 7270001
  leader-check-interval: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
