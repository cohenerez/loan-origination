# The only public entry point, as in docker-compose.prod.yml. k3s's built-in load balancer
# (ServiceLB) binds ports 80 and 443 on the VM, so install k3s with Traefik disabled.
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
data:
  # Same rules as services/deploy/Caddyfile
  Caddyfile: |
    {$PUBLIC_HOST} {
    	encode gzip

    	@scoring path /api/v1/* /actuator/health
    	handle @scoring {
    		reverse_proxy credit-scoring:8080
    	}

    	handle {
    		respond 404
    	}
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data # Let's Encrypt certificates survive restarts
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
spec:
  type: LoadBalancer
  selector:
    app: caddy
  ports:
    - name: http
      port: 80
    - name: https
      port: 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
spec:
  replicas: 1
  strategy:
    type: Recreate # the certificate volume can be mounted by one pod at a time
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      enableServiceLinks: false
      containers:
        - name: caddy
          image: caddy:2
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          env:
            - name: PUBLIC_HOST
              valueFrom:
                secretKeyRef:
                  name: loan-secrets
                  key: PUBLIC_HOST
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: caddy-config
        - name: data
          persistentVolumeClaim:
            claimName: caddy-data
