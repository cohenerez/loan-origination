# PostgreSQL 17 with one database per service (scoring, notifications, bridge).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  # Same script as services/postgres/init/01-create-databases.sql; runs only on an empty volume
  01-create-databases.sql: |
    SELECT 'CREATE DATABASE scoring'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'scoring')\gexec
    SELECT 'CREATE DATABASE notifications'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'notifications')\gexec
    SELECT 'CREATE DATABASE bridge'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'bridge')\gexec
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      enableServiceLinks: false
      securityContext:
        # PostgreSQL's processes signal each other (checkpoints, new connections, shutdown).
        # On this VM's kernel (7.0, Ubuntu) the AppArmor profile that k3s's containerd applies,
        # cri-containerd.apparmor.d, denies those signals: dmesg shows apparmor="DENIED"
        # operation="signal" towards the peer "cri-containerd.apparmor.d//&unconfined", and
        # PostgreSQL hangs with "could not signal for checkpoint: Permission denied".
        # Docker's own profile allows them, which is why Compose works.
        appArmorProfile:
          type: Unconfined
        # Still confined by the runtime's default seccomp filter, and not running as root:
        seccompProfile:
          type: RuntimeDefault
        # The image's postgres user (uid 999). The entrypoint then skips gosu, which needs no
        # root and was the first process to hang on the denied signals.
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: scoring
            - name: POSTGRES_USER
              value: scoring
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loan-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          # First start (initdb, init script) and crash recovery can take minutes on the VM's disk.
          # The startup probe allows up to 5 minutes; liveness only begins after it, so Kubernetes
          # never kills PostgreSQL in the middle of setup or recovery.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "scoring", "-d", "scoring"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "scoring", "-d", "scoring"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "scoring", "-d", "scoring"]
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
