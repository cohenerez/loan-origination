# PostgreSQL 17 with one database per service (scoring, notifications, bridge).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  # Same script as services/postgres/init/01-create-databases.sql; runs only on an empty volume
  01-create-databases.sql: |
    SELECT 'CREATE DATABASE scoring'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'scoring')\gexec
    SELECT 'CREATE DATABASE notifications'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'notifications')\gexec
    SELECT 'CREATE DATABASE bridge'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'bridge')\gexec
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      enableServiceLinks: false
      # Start directly as the image's postgres user (uid 999). Started as root, the entrypoint
      # switches user with gosu, which hung at 100% CPU on k3s on the ARM VM before PostgreSQL
      # printed anything. As postgres the entrypoint skips gosu; fsGroup lets it own the volume.
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: scoring
            - name: POSTGRES_USER
              value: scoring
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loan-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "scoring", "-d", "scoring"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "scoring", "-d", "scoring"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
